<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="A sweet birthday gift website for Leslie, made with love by Jannik."
    >
    <title>Happy Birthday Leslie</title>
    <link rel="stylesheet" href="styles.css">
    <script src="assets/data/memories.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="site-shell">
      <div class="background-glow background-glow--one" aria-hidden="true"></div>
      <div class="background-glow background-glow--two" aria-hidden="true"></div>
      <div class="floaters" aria-hidden="true">
        <span class="floater floater--one"></span>
        <span class="floater floater--two"></span>
        <span class="floater floater--three"></span>
        <span class="floater floater--four"></span>
        <span class="floater floater--five"></span>
        <span class="floater floater--six"></span>
      </div>
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>

      <section class="welcome" id="welcome" aria-label="Gift question">
        <div class="welcome__content">
          <p class="welcome__message" id="welcomeMessage">
            Coucou mon Amoureuse, are you ready to receive your gift?
          </p>
          <div class="welcome__illustrations" aria-hidden="true">
            <img
              class="welcome__image welcome__image--landing"
              id="landingImage"
              src="assets/illustrations/bear_otter_landing.png"
              alt=""
            >
            <img
              class="welcome__image welcome__image--wrong is-hidden"
              id="wrongAnswerImage"
              src="assets/illustrations/bear_otter_wrongAnswer.png"
              alt=""
            >
          </div>
          <div class="welcome__actions" id="readyActions">
            <button
              class="welcome__button welcome__button--yes"
              id="acceptGift"
              type="button"
              aria-label="Yes, show the gift"
            >
              <span aria-hidden="true">✓</span>
            </button>
            <button
              class="welcome__button welcome__button--no"
              id="declineGift"
              type="button"
              aria-label="No, not ready"
            >
              <span aria-hidden="true">×</span>
            </button>
          </div>
          <div class="welcome__actions welcome__actions--back is-hidden" id="pleaseActions">
            <button
              class="welcome__button welcome__button--back"
              id="backToQuestion"
              type="button"
              aria-label="Go back to the question"
            >
              <span aria-hidden="true">←</span>
            </button>
          </div>
        </div>
      </section>

      <section class="intro is-hidden" id="intro" aria-label="Birthday message" tabindex="0">
        <div class="intro__content">
          <h1 class="intro__title">Happy Birthday Leslie</h1>
          <p class="intro__love">
            <span class="intro__love-line intro__love-line--first">I love you</span>
          </p>
        </div>
      </section>

      <section
        class="memory-wall is-hidden"
        id="memoryWall"
        aria-label="Floating memories"
        aria-live="polite"
      >
        <div class="memory-wall__message">
          <p>A sky full of our memories</p>
        </div>
        <div class="memory-stage" id="memoryStage"></div>
      </section>

      <button
        class="love-letter-flyer is-hidden"
        id="loveLetterFlyer"
        type="button"
        aria-label="Open love letter"
      >
        <span class="love-letter-flyer__paper" aria-hidden="true">
          <span class="love-letter-flyer__heart">&hearts;</span>
        </span>
      </button>

      <section
        class="love-letter-modal is-hidden"
        id="loveLetterModal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="loveLetterTitle"
      >
        <div class="love-letter-modal__panel">
          <button
            class="love-letter-modal__close"
            id="closeLoveLetter"
            type="button"
            aria-label="Close love letter"
          >
            &times;
          </button>
          <h2 class="love-letter-modal__title" id="loveLetterTitle">My love,</h2>
          <p class="love-letter-modal__text">
            This is a placeholder for your love letter. Write something here that feels like only
            the two of you could understand it.
          </p>
        </div>
      </section>
    </main>

    <template id="memoryItemTemplate">
      <figure class="memory-item" tabindex="0">
        <div class="memory-item__float">
          <div class="memory-item__pop">
            <div class="memory-item__inner"></div>
          </div>
        </div>
      </figure>
    </template>
  </body>
</html>
